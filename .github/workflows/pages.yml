# Publishes the portfolio to GitHub Pages at https://dartsac.github.io/Isaac-Portfolio/.
# The site is plain static files, so there is no build step: the repository is published as it is.
# The browser test suite gates each deploy, then runs again against the public site.
# One-time setup: the repository's Settings → Pages → Source must be "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one partway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The suite runs on macOS, where it is written and where WebKit is Safari's own engine. On Linux, a few
  # of its pixel checks see antialiasing color that macOS doesn't draw.
  test:
    name: Test locally
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-local
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Test the public site
    needs: deploy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm test
        env:
          PORTFOLIO_URL: ${{ needs.deploy.outputs.page_url }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-public
          path: test-results/
          retention-days: 7
