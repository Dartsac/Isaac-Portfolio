# Publishes the portfolio to GitHub Pages at https://dartsac.github.io/Isaac-Portfolio/.
# The site is plain static files, so there is no build step: its files are copied and published as they are.
# The browser test suite gates each deploy by testing that copy, then runs again against the public site.
# One-time setup: the repository's Settings → Pages → Source must be "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one partway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test the site to publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Only the site itself is published, not the tests and tooling around it. The suite tests this
      # copy, so a file the site needs but this list leaves out fails here, before anything goes live.
      - name: Copy the site's files
        run: mkdir "$RUNNER_TEMP/site" && cp -R index.html css js img svg resume "$RUNNER_TEMP/site/"
      - run: npm test
        env:
          SITE_ROOT: ${{ runner.temp }}/site
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-before-deploy
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Test the public site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
        env:
          PORTFOLIO_URL: ${{ needs.deploy.outputs.page_url }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-public-site
          path: test-results/
          retention-days: 7
