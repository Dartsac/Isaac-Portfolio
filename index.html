<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="Your description goes here" />
    <meta name="keywords" content="one, two, three" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind:wght@300;400;500;600;700&family=Major+Mono+Display&display=swap"
      rel="stylesheet"
    />
    <title>Blank Template</title>

    <!-- external CSS link -->
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="lottie-bg">
      <lottie-player
        class="apple-animation"
        src="https://assets9.lottiefiles.com/packages/lf20_jpsi2mle.json"
        background="transparent"
        speed="1"
        autoplay
      ></lottie-player>
    </div>
    <header>
      <div class="social-icons">
        <img src="svg/logo-github.svg" alt="github" />
        <img src="svg/logo-linkedin.svg" alt="linkedin" />
        <img src="svg/logo-twitter.svg" alt="twitter" />
      </div>
      <div class="my-logo"></div>

      <ul>
        <li>About</li>
        <li>Projects</li>
        <li>Technologies</li>
      </ul>
    </header>
    <main>
      <img class="profile-pic" src="img/headshot.png" alt="headshot" />
      <h1 class="title">Isaac Dobson</h1>
      <div class="grain"></div>
      <p>Your Next Full-Stack Engineer</p>
    </main>
    <div id="lottie-container"></div>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.8/lottie.min.js"></script>
    <script>
      var animation = bodymovin.loadAnimation({
        container: document.getElementById('lottie-container'),
        renderer: 'svg',
        loop: false,
        autoplay: true,
        src: 'https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js',
      })

      animation.addEventListener('complete', function () {
        var container = document.getElementById('lottie-container')
        container.parentNode.removeChild(container)
      })
    </script>
    <script type="text/javascript" src="js/main.js"></script>
  </body>
</html>
